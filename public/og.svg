<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="1" stop-color="#0A0F24"/>
    </linearGradient>
    <linearGradient id="grad" x1="120" y1="220" x2="700" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9945FF"/>
      <stop offset="0.5" stop-color="#2F80FF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientTransform="translate(200 120) rotate(45) scale(420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9945FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9945FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientTransform="translate(1050 560) rotate(45) scale(420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Logo mark -->
  <g transform="translate(90 90)">
    <rect width="88" height="88" rx="22" fill="url(#grad)" fill-opacity="0.16"/>
    <rect x="1.5" y="1.5" width="85" height="85" rx="20.5" stroke="url(#grad)" stroke-opacity="0.5" stroke-width="3"/>
    <path d="M27 25C27 22.8 28.8 21 31 21H62V32H40V41H58V52H40V61H62V72H31C28.8 72 27 70.2 27 68V25Z" fill="url(#grad)"/>
  </g>
  <text x="200" y="150" font-family="Space Grotesk, Arial, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">Eventerz</text>

  <!-- Headline -->
  <text x="90" y="330" font-family="Space Grotesk, Arial, sans-serif" font-size="82" font-weight="700" fill="#FFFFFF">Wallet-native Events</text>
  <text x="90" y="425" font-family="Space Grotesk, Arial, sans-serif" font-size="82" font-weight="700" fill="#FFFFFF">for the <tspan fill="url(#grad)">Future.</tspan></text>

  <!-- Subtitle -->
  <text x="92" y="500" font-family="Inter, Arial, sans-serif" font-size="30" fill="#94A3B8">Everything is On-chain. Why not your events? · Built on Solana</text>

  <!-- Chips -->
  <g font-family="Inter, Arial, sans-serif" font-size="24" fill="#CBD5E1">
    <rect x="90" y="540" width="230" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1"/>
