<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="1" stop-color="#0A0F24"/>
    </linearGradient>
    <linearGradient id="grad" x1="120" y1="220" x2="700" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9945FF"/>
      <stop offset="0.5" stop-color="#2F80FF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientTransform="translate(200 120) rotate(45) scale(420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9945FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9945FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientTransform="translate(1050 560) rotate(45) scale(420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Logo mark (3D folded-ribbon E) -->
  <svg x="80" y="72" width="108" height="108" viewBox="0 0 100 100">
    <defs>
      <linearGradient id="mFront" x1="24" y1="18" x2="80" y2="82" gradientUnits="userSpaceOnUse">
        <stop stop-color="#A374FF"/><stop offset="1" stop-color="#7A2BE0"/>
      </linearGradient>
      <linearGradient id="mTop" x1="14" y1="10" x2="80" y2="55" gradientUnits="userSpaceOnUse">
        <stop stop-color="#E7DCFF"/><stop offset="1" stop-color="#C2A9FF"/>
      </linearGradient>
      <linearGradient id="mSide" x1="14" y1="10" x2="24" y2="82" gradientUnits="userSpaceOnUse">
        <stop stop-color="#5C24AE"/><stop offset="1" stop-color="#3E1A80"/>
      </linearGradient>
    </defs>
    <g transform="translate(4 3)">
      <path d="M24 18 L24 82 L14 74 L14 10 Z" fill="url(#mSide)"/>
      <path d="M24 18 L80 18 L70 10 L14 10 Z" fill="url(#mTop)"/>
      <path d="M42 43 L72 43 L62 35 L32 35 Z" fill="url(#mTop)"/>
      <path d="M42 63 L80 63 L70 55 L32 55 Z" fill="url(#mTop)"/>
      <path d="M24 18 L80 18 L80 37 L42 37 L42 43 L72 43 L72 58 L42 58 L42 63 L80 63 L80 82 L24 82 Z" fill="url(#mFront)"/>
