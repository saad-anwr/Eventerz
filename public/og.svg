  </svg>
  <text x="200" y="150" font-family="Space Grotesk, Arial, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">Eventerz</text>

  <!-- Headline -->
  <text x="90" y="330" font-family="Space Grotesk, Arial, sans-serif" font-size="82" font-weight="700" fill="#FFFFFF">Wallet-native Events</text>
  <text x="90" y="425" font-family="Space Grotesk, Arial, sans-serif" font-size="82" font-weight="700" fill="#FFFFFF">for the <tspan fill="url(#grad)">Future.</tspan></text>

  <!-- Subtitle -->
  <text x="92" y="500" font-family="Inter, Arial, sans-serif" font-size="30" fill="#94A3B8">Everything is On-chain. Why not your events? · Built on Solana</text>

  <!-- Chips -->
  <g font-family="Inter, Arial, sans-serif" font-size="24" fill="#CBD5E1">
    <rect x="90" y="540" width="230" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1"/>
