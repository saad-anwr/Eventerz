    <rect x="336" y="540" width="250" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="364" y="573">On-chain RSVP</text>
    <rect x="602" y="540" width="300" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="630" y="573">Proof of Attendance</text>
